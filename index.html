<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Cheemsificaciones Pomkémon: fanarts de Pokémon al estilo Cheems por Yeims.">
  <link rel="icon" href="assets/img/ui/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#a0161f">
  <link rel="apple-touch-icon" href="assets/img/ui/apple-touch-icon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/index.css">
  <script type="module" src="js/core/layout.js" blocking="render"></script>

<body data-pagina="inicio">
  <a class="saltar-contenido" href="#contenido">Saltar al contenido</a>

  <div class="sitio">
    <header id="encabezado"></header>

    <main id="contenido" class="contenido" tabindex="-1">
      <h1 class="visualmente-oculto">Cheemsificaciones Pomkémon</h1>

      <section class="inicio-seccion" aria-labelledby="titulo-novedades">
        <div class="inicio-seccion__cabecera">
          <h2 class="inicio-seccion__titulo" id="titulo-novedades">Novedades</h2>
          <a class="inicio-seccion__enlace" href="novedades.html">Ver todas →</a>
        </div>
        <div id="carrusel-novedades">
          <p class="visualmente-oculto" role="status">Cargando novedades...</p>
          <div class="banner-novedad esqueleto" aria-hidden="true"></div>
        </div>
      </section>

      <section class="inicio-seccion" aria-labelledby="titulo-conoce">
        <div class="inicio-seccion__cabecera">
          <h2 class="inicio-seccion__titulo" id="titulo-conoce">Conoce a...</h2>
          <button class="boton-ovalado boton-ovalado--secundario boton-ovalado--chico" type="button" id="otros-pomkemon" hidden>
            <span aria-hidden="true">🎲</span> Conocer a otros
          </button>
        </div>
        <div class="grilla" id="conoce-a" aria-live="polite">
          <p class="visualmente-oculto" role="status">Cargando Pomkémon...</p>
          <div class="tarjeta-pomkemon tarjeta-esqueleto" aria-hidden="true">
            <span class="esqueleto esqueleto--linea esqueleto--corta"></span>
            <div class="marco-imagen esqueleto"></div>
            <span class="esqueleto esqueleto--pildora"></span>
          </div>
          <div class="tarjeta-pomkemon tarjeta-esqueleto" aria-hidden="true">
            <span class="esqueleto esqueleto--linea esqueleto--corta"></span>
            <div class="marco-imagen esqueleto"></div>
            <span class="esqueleto esqueleto--pildora"></span>
          </div>
          <div class="tarjeta-pomkemon tarjeta-esqueleto" aria-hidden="true">
            <span class="esqueleto esqueleto--linea esqueleto--corta"></span>
            <div class="marco-imagen esqueleto"></div>
            <span class="esqueleto esqueleto--pildora"></span>
          </div>
        </div>
        <div class="ver-mas">
          <a class="boton-ovalado" href="pomkedex.html">Ver toda la Pomkédex</a>
        </div>
      </section>

      <noscript>
        <p class="bloque__texto">Este sitio necesita JavaScript activado para mostrar su contenido.</p>
      </noscript>
    </main>

    <footer id="pie"></footer>
  </div>

  <script type="module" src="js/index.js"></script>

</html>
